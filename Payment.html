<!DOCTYPE html>
<html>
<head>
    <title>Payment Gateway</title>
</head>
<body>

    <center>
        <h1>Online Book Store System</h1>
        <h2>4. Payment Page</h2>
        <br>
        
        <!-- Secure total display in INR -->
        <h3>Total Amount to Pay: ₹<span id="totalAmount">0.00</span></h3>
        <br>

        <form onsubmit="event.preventDefault(); processPayment();">
            Card Number: <input type="text" pattern="[0-9]{16}" placeholder="16-digit number" required><br><br>
            Expiry Date: <input type="text" placeholder="MM/YY" pattern="[0-9]{2}/[0-9]{2}" required><br><br>
            CVV Number: <input type="password" pattern="[0-9]{3}" placeholder="3 digits" required><br><br>
            <input type="submit" value="Make Payment">
        </form>
        
        <br><br>
        <a href="book.html">← Go Back to Books</a>
    </center>

    <script>
        // Reads data from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('total');
        const booksParam = urlParams.get('books');

        window.onload = function() {
            if (amount) {
                document.getElementById('totalAmount').textContent = amount;
            }
        }

        // Processes simulated data and saves it to local storage for Admin tracking
        function processPayment() {
            alert('Payment Successful! ₹' + amount + ' has been deducted. Your books are ordered.');
            
            // Track Orders for Admin Portal using basic Browser Storage
            let totalOrders = parseInt(localStorage.getItem('totalOrders') || "0");
            totalOrders += 1;
            localStorage.setItem('totalOrders', totalOrders);

            if (booksParam) {
                let currentSales = JSON.parse(localStorage.getItem('booksSold') || "[]");
                let purchased = booksParam.split(',');
                purchased.forEach(book => {
                    if (!currentSales.includes(book)) {
                        currentSales.push(book);
                    }
                });
                localStorage.setItem('booksSold', JSON.stringify(currentSales));
            }

            // Redirect back to books page after successful submission
            window.location.href = "book.html";
        }
    </script>

</body>
</html>
